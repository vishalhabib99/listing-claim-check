[project]
name = "listing-claim-check"
version = "0.2.0"
description = "Checks AI-written marketplace listings against the seller's item specifics before they're published: PUBLISH or REVIEW, with the exact words for every unbacked claim."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.0"]

[project.scripts]
listing-claim-check = "listing_claim_check.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listing_claim_check"]
